[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "familypc"
version = "0.1.0"
description = "FamilyPC-Daemon: Nutzungszeiten & Internet-Sperre pro Linux-Nutzerkonto (Linux Mint)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "freezegun>=1.4",
    "httpx>=0.27",
]

[project.scripts]
familypc = "familypc.__main__:main"
familypc-pam-check = "familypc.pam_check:main"
familypc-panel = "familypc.panel:main"
familypc-panel-admin = "familypc.panel_admin:main"

[tool.setuptools.packages.find]
include = ["familypc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
