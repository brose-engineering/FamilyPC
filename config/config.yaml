# FamilyPC-Konfiguration — wird von install.sh nach /etc/familypc/config.yaml installiert.
#
# Konvention: Fehlende Felder = Feature deaktiviert, der Daemon startet trotzdem.
# Ungültige Werte lassen den Daemon mit Exit-Code 2 enden (kein Absturz, kein Restart-Loop).

daemon:
  log_level: INFO                  # DEBUG | INFO | WARNING | ERROR | CRITICAL
  heartbeat_interval_seconds: 60   # Heartbeat-Eintrag ins journald
  state_dir: /var/lib/familypc     # SQLite-DB für Zeitverbrauch (usage.db)

# Session-Tracking (FAM-4). Sektion komplett weglassen = Tracking deaktiviert.
tracking:
  enabled: true
  poll_interval_seconds: 10        # logind-Abfrage-Intervall (Genauigkeit des Verbrauchs)
  reset_hour: 0                    # taeglicher Reset um 00:00 Uhr (konfigurierbar)
  count_remote_sessions: false     # reine SSH-Sessions zaehlen nicht
  count_inactive_sessions: true    # Fast-User-Switching: weggeswitchte Sessions zaehlen weiter
  excluded_users: ["root", "lightdm"]  # Admin-/Daemon-/System-User (uid < 1000 zaehlt nie)

# Durchsetzung (FAM-7 Tagesbudget + FAM-8 Fenster). Sektion weglassen = deaktiviert.
enforcement:
  enabled: true
  warn_minutes: [10, 5]          # Warn-Notifications bei 10 und 5 Minuten Restzeit
  window_prewarning_minutes: 10  # Vorwarnung vor Fensterende
  protected_users: ["parent"]    # Admin-Konto wird niemals eingesperrt

# Pro-Konto-Regeln (ab FAM-4/5/7/8/9). Leer = keine Einschränkungen.
accounts: {}
  # kind1:
  #   daily_budget_minutes: 120            # FAM-7: 0/fehlend = unbegrenzt
  #   internet_enabled: true               # FAM-5: false = Internet komplett aus
  #   internet_daily_budget_minutes: 60    # FAM-9: 0/fehlend = unbegrenzt
  #   windows:                             # FAM-8: erlaubte Zeitfenster je Wochentag (0=Mo ... 6=So)
  #     0: [{ start: "15:00", end: "19:00" }]
  #     1: [{ start: "15:00", end: "19:00" }]
  #     5: [{ start: "09:00", end: "19:00" }]
  #     6: [{ start: "09:00", end: "19:00" }]

# Admin-Panel (FAM-10 localhost, FAM-12/13 LAN+HTTPS). Sektion weglassen = Panel deaktiviert.
# FAM-12: Login mit eigenen Panel-Accounts (Initial-Account als root:
#   sudo familypc-panel-admin --config /etc/familypc/config.yaml add <name>
#   ohne Login kein API-Zugriff — auch nicht von localhost).
# FAM-13: host 0.0.0.0 = Bindung ans LAN, erreichbar via https://familypc.local:8787 (Avahi).
# Aenderungen per Panel schreiben diese Datei; der Daemon laedt sie automatisch neu (kein Neustart).
ui:
  enabled: true
  host: 0.0.0.0                 # FAM-13: LAN; fuer reines localhost 127.0.0.1 setzen
  port: 8787                    # HTTPS-Port
  http_port: 8786               # HTTP-Redirect auf HTTPS (0 = aus)
  tls_enabled: true             # selbstsigniertes Zertifikat (panel.crt/panel.key)
  tls_cert: /etc/familypc/panel.crt
  tls_key: /etc/familypc/panel.key
  session_hours: 12
  max_login_fails: 5            # dann temporaere Sperre (lockout_minutes)
  lockout_minutes: 15
